name: Auto Resume Upload

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        
      - name: Create auth.json from Secret
        env:
          AUTH_SECRET: ${{ secrets.NAUKRI_AUTH_JSON }}
        run: node -e "require('fs').writeFileSync('auth.json', process.env.AUTH_SECRET)"

      - name: "Debug: Verify auth.json and network"
        run: |
          node -e "const s=require('fs').readFileSync('auth.json','utf8'); console.log('auth.json length:', s.length);"
          echo "=== curl HTTP/1.1 ==="
          curl -v --http1.1 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://www.naukri.com/mnjuser/profile 2>&1 | tail -30 || true
          
      - name: Run Upload Script
        env:
          DEBUG: pw:api
        run: npm run upload
        
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
